# Include Typst sources and JSON metadata in the recursive documentation scan.
extensions = ["md", "typ", "json", "txt"]
# Preserved research snapshots are evidence, not maintained documentation.
# Keep provenance/rights-research.md in the scan.
exclude_path = [
    '(^|/)provenance/image-research(/|$)',
    '(^|/)provenance/recovered-lines\.json$',
    '(^|/)(build|work|\.git)(/|$)',
]
timeout = 30
max_concurrency = 3
max_retries = 2
include_mail = false
accept = [200, 204, 301, 302]
user_agent = "ScienceCuriosityBook/1.0 (https://www.indrapatil.com/; editorial image attribution)"

require_https = true
