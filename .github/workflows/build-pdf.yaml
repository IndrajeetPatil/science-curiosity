name: Build and publish PDF

on:
  push:
    branches: [main]
    paths:
      - "*.typ"
      - "*.json"
      - "Makefile"
      - "science-curiosity.pdf"
      - "chapters/**"
      - "figures/**"
      - "fonts/**"
      - "tools/**"
      - "site/**"
      - ".github/workflows/build-pdf.yaml"
  # Run on every pull request so the required build check always reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a Pages deployment on main part-way through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: typst-community/setup-typst@00ad6338f0b34724ea002136bfb701a6c18585b0 # v5.3.2
        with:
          typst-version: 0.15.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build and check the PDF
        run: make check

      - name: Check the committed PDF matches the source
        run: |
          git diff --exit-code --stat -- science-curiosity.pdf || {
            echo "::error file=science-curiosity.pdf::Rebuild the PDF with 'make build' and commit it."
            exit 1
          }

      - name: Assemble the Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp site/index.html science-curiosity.pdf _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}science-curiosity.pdf
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
